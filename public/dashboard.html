<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Health Checker</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="header">
  <div class="header-title">Health <span>Checker</span></div>
  <div class="header-actions">
    <span class="text-muted" style="font-size:12px" id="lastRefresh"></span>
    <span class="refresh-dot" title="Auto-refresh aktiv"></span>
    <button id="versionBtn" onclick="showUpdateModal()" class="btn btn-sm" style="background:var(--surface2);color:var(--muted);border:1px solid var(--border);cursor:default;font-size:11px" disabled>v—</button>
    <a href="/admin.html" class="btn btn-secondary btn-sm">Admin</a>
    <button onclick="logout()" class="btn btn-secondary btn-sm">Abmelden</button>
  </div>
</div>

<div class="container">
  <div class="stats-bar" id="statsBar">
    <div class="stat-card"><div class="label">Gesamt</div><div class="value" id="statTotal">—</div></div>
    <div class="stat-card up"><div class="label">Online</div><div class="value" id="statUp">—</div></div>
    <div class="stat-card partial"><div class="label">Teilweise</div><div class="value" id="statPartial">—</div></div>
    <div class="stat-card down"><div class="label">Offline</div><div class="value" id="statDown">—</div></div>
    <div class="stat-card unknown"><div class="label">Unbekannt</div><div class="value" id="statUnknown">—</div></div>
  </div>

  <div id="alert" class="alert alert-error" style="display:none"></div>

  <div id="updateModal" class="modal-backdrop" style="display:none" onclick="if(event.target===this)this.style.display='none'">
    <div class="modal" style="max-width:640px">
      <div class="modal-header">
        <h3>Update verfügbar</h3>
        <button class="modal-close" onclick="document.getElementById('updateModal').style.display='none'">&times;</button>
      </div>
      <div class="modal-body">
        <div id="updateInfo" style="margin-bottom:16px;font-size:13px"></div>
        <div id="updateNotes" style="max-height:400px;overflow-y:auto;font-size:13px;line-height:1.6"></div>
      </div>
      <div class="modal-footer">
        <a id="updateReleaseLink" href="#" target="_blank" rel="noopener" class="btn btn-primary btn-sm">Release auf GitHub</a>
        <button onclick="document.getElementById('updateModal').style.display='none'" class="btn btn-secondary btn-sm">Schließen</button>
      </div>
    </div>
  </div>
  <div class="service-grid" id="grid">
    <div class="empty-state"><p>Lade Dienste…</p></div>
  </div>
</div>

<script>
let refreshTimer;

async function checkAuth() {
  const r = await fetch('/admin/session');
  const d = await r.json();
  if (!d.authenticated) { window.location.href = '/login.html'; return false; }
  return true;
}

async function load() {
  try {
    const res = await fetch('/admin/services');
    if (res.status === 401) { window.location.href = '/login.html'; return; }
    const services = await res.json();

    const up = services.filter(s => s.status === 'up').length;
    const partial = services.filter(s => s.status === 'partial').length;
    const down = services.filter(s => s.status === 'down').length;
    const unknown = services.filter(s => s.status === 'unknown').length;

    document.getElementById('statTotal').textContent = services.length;
    document.getElementById('statUp').textContent = up;
    document.getElementById('statPartial').textContent = partial;
    document.getElementById('statDown').textContent = down;
    document.getElementById('statUnknown').textContent = unknown;
    document.getElementById('lastRefresh').textContent =
      'Aktualisiert: ' + new Date().toLocaleTimeString('de-DE');

    const grid = document.getElementById('grid');
    if (!services.length) {
      grid.innerHTML = '<div class="empty-state"><p>Keine Dienste konfiguriert. Gehe zu <a href="/admin.html">Admin</a>, um Dienste hinzuzufügen.</p></div>';
      return;
    }

    grid.innerHTML = services.map(s => {
      if (s.dual_stack) {
        const r4 = s.last_check_v4, r6 = s.last_check_v6;
        const cardStatus = s.status;
        const borderColor = { up: 'var(--up)', partial: 'var(--warn)', down: 'var(--down)', unknown: 'var(--unknown)' }[cardStatus] || 'var(--unknown)';
        const badgeStyle = { up: 'badge-up', partial: '', down: 'badge-down', unknown: 'badge-unknown' }[cardStatus];
        const statusLabel = { up: 'Alle Online', partial: 'Teilweise Online', down: 'Offline', unknown: 'Unbekannt' }[cardStatus];
        const age = timeAgo((r4 || r6)?.checked_at);
        const disabledBadge = !s.enabled ? '<span class="badge badge-unknown" style="margin-left:6px">Deaktiviert</span>' : '';

        const ipRow = (r, proto) => {
          if (!r) return `
            <div class="ds-row">
              <span class="badge badge-unknown" style="font-size:11px;min-width:36px;justify-content:center">${proto}</span>
              <span class="text-muted">—</span>
            </div>`;
          const badge = r.is_up ? 'badge-up' : 'badge-down';
          const label = r.is_up ? 'Online' : 'Offline';
          const detail = r.is_up
            ? `<span class="text-mono" style="font-size:12px">${esc(r.resolved_ip || '?')}</span><span class="text-muted" style="font-size:12px">${r.response_time_ms != null ? ' · ' + r.response_time_ms + 'ms' : ''}</span>`
            : `<span style="color:var(--down);font-size:12px">${esc(r.error || r.resolved_ip || '?')}</span>`;
          return `
            <div class="ds-row">
              <span class="badge ${badge}" style="font-size:11px;min-width:36px;justify-content:center">${proto}</span>
              ${detail}
            </div>`;
        };

        return `<div class="service-card" style="border-left:3px solid ${borderColor}">
          <div class="service-card-header">
            <div>
              <div class="service-name">${esc(s.name)}${disabledBadge}</div>
              <div class="service-url">${esc(s.url)}</div>
            </div>
            <span class="badge ${badgeStyle}" style="${cardStatus==='partial'?'background:#78350f33;color:var(--warn)':''}">${statusLabel}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
            ${ipRow(r4, 'IPv4')}
            ${ipRow(r6, 'IPv6')}
          </div>
          <div class="service-meta" style="margin-top:10px">
            <span style="color:var(--muted)">⟳ <strong>${age}</strong></span>
          </div>
        </div>`;
      }

      const status = s.last_check ? (s.last_check.is_up ? 'up' : 'down') : 'unknown';
      const label = { up: 'Online', down: 'Offline', unknown: 'Unbekannt' }[status];
      const rt = s.last_check?.response_time_ms != null ? `${s.last_check.response_time_ms} ms` : '—';
      const code = s.last_check?.status_code || (s.last_check?.error ? 'Fehler' : '—');
      const ip = s.last_check?.resolved_ip ? `<span class="text-mono" style="color:var(--muted);font-size:11px">${esc(s.last_check.resolved_ip)}</span>` : '';
      const age = s.last_check ? timeAgo(s.last_check.checked_at) : 'nie';
      const disabledBadge = !s.enabled ? '<span class="badge badge-unknown" style="margin-left:6px">Deaktiviert</span>' : '';

      return `<div class="service-card card-${status}">
        <div class="service-card-header">
          <div>
            <div class="service-name">${esc(s.name)} ${disabledBadge}</div>
            <div class="service-url">${esc(s.url)} ${ip}</div>
          </div>
          <span class="badge badge-${status}">${label}</span>
        </div>
        ${s.last_check?.error ? `<div style="color:var(--down);font-size:12px;margin-bottom:8px">${esc(s.last_check.error)}</div>` : ''}
        <div class="service-meta">
          <span title="HTTP Status">HTTP: <strong>${code}</strong></span>
          <span title="Antwortzeit">⏱ <strong>${rt}</strong></span>
          <span title="Letzter Check">⟳ <strong>${age}</strong></span>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    console.error(e);
  }
}

function timeAgo(iso) {
  if (!iso) return 'nie';
  const sec = Math.floor((Date.now() - new Date(iso + (iso.endsWith('Z') ? '' : 'Z'))) / 1000);
  if (sec < 5) return 'gerade eben';
  if (sec < 60) return `vor ${sec}s`;
  if (sec < 3600) return `vor ${Math.floor(sec/60)}m`;
  return `vor ${Math.floor(sec/3600)}h`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function logout() {
  await fetch('/admin/logout', { method: 'POST' });
  window.location.href = '/login.html';
}

// --- Update Check ---

let _updateInfo = null;

async function checkForUpdates() {
  try {
    const res = await fetch('/admin/update-check');
    if (!res.ok) return;
    const data = await res.json();
    _updateInfo = data;
    const btn = document.getElementById('versionBtn');
    if (data.update_available) {
      btn.textContent = `↑ v${data.latest}`;
      btn.style.background = '#78350f33';
      btn.style.color = '#fbbf24';
      btn.style.borderColor = '#92400e';
      btn.style.cursor = 'pointer';
      btn.disabled = false;
    } else if (data.current) {
      btn.textContent = `v${data.current} ✓`;
      btn.style.color = data.latest ? 'var(--up)' : 'var(--muted)';
      btn.style.cursor = 'default';
      btn.disabled = true;
    }
  } catch (_) {}
}

function scheduleUpdateChecks() {
  const delayMs = (6 * 60 + Math.floor(Math.random() * 10)) * 60 * 1000;
  setTimeout(async () => {
    await checkForUpdates();
    scheduleUpdateChecks();
  }, delayMs);
}

async function showUpdateModal() {
  if (!_updateInfo || !_updateInfo.update_available) return;
  const info = _updateInfo;
  const pub = info.published_at ? new Date(info.published_at).toLocaleDateString('de-DE') : null;
  document.getElementById('updateInfo').innerHTML =
    `<p>Installierte Version: <strong>v${esc(info.current)}</strong> &rarr; Neue Version: <strong>v${esc(info.latest)}</strong></p>` +
    (info.release_name ? `<p style="color:var(--muted);margin-top:4px">${esc(info.release_name)}</p>` : '') +
    (pub ? `<p style="color:var(--muted);margin-top:2px">Veröffentlicht: ${pub}</p>` : '');
  document.getElementById('updateReleaseLink').href = info.release_url || '#';

  const notesEl = document.getElementById('updateNotes');
  notesEl.innerHTML = '<p style="color:var(--muted)">Lade Release Notes…</p>';
  document.getElementById('updateModal').style.display = 'flex';

  try {
    const r = await fetch(info.notes_url);
    if (!r.ok) throw new Error('not found');
    notesEl.innerHTML = renderMd(await r.text());
  } catch (_) {
    notesEl.innerHTML = '<p style="color:var(--muted)">Release Notes nicht verfügbar.</p>';
  }
}

function renderMd(md) {
  const lines = md.split('\n');
  let html = '';
  let inList = false;
  for (const raw of lines) {
    if (raw.startsWith('### ')) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h4 style="margin:12px 0 4px;color:var(--text)">${inlineMd(raw.slice(4))}</h4>`;
    } else if (raw.startsWith('## ')) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h3 style="margin:14px 0 6px;color:var(--text)">${inlineMd(raw.slice(3))}</h3>`;
    } else if (raw.startsWith('# ')) {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<h2 style="margin:16px 0 8px;color:var(--accent)">${inlineMd(raw.slice(2))}</h2>`;
    } else if (raw.match(/^[-*] /)) {
      if (!inList) { html += '<ul style="padding-left:18px;margin:4px 0">'; inList = true; }
      html += `<li style="margin:2px 0">${inlineMd(raw.slice(2))}</li>`;
    } else if (raw.trim() === '') {
      if (inList) { html += '</ul>'; inList = false; }
      html += '<br>';
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += `<p style="margin:3px 0">${inlineMd(raw)}</p>`;
    }
  }
  if (inList) html += '</ul>';
  return html;
}

function inlineMd(s) {
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

(async () => {
  if (!await checkAuth()) return;
  await load();
  refreshTimer = setInterval(load, 30000);
  await checkForUpdates();
  scheduleUpdateChecks();
})();
</script>
</body>
</html>
